# Supabase CLI configuration for local development (`supabase start`).
# Hosted projects are configured in the dashboard — see README "Authentication setup".
project_id = "edgetrack"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 10000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Access tokens expire after 1 hour and are refreshed while the app is open.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# EdgeTrack is a private tracker: accounts are created server-side only.
enable_signup = false
minimum_password_length = 6

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = false

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[functions.username-login]
enabled = true
verify_jwt = false
